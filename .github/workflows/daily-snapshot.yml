name: Daily Snapshot

on:
  schedule:
    # 每天 06:00 UTC+8 = 22:00 UTC 前一天
    - cron: '0 22 * * *'
  workflow_dispatch: # 手动触发

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install requests pillow
      
      # === Steam 数据 ===
      - name: Run steam crawler
        run: |
          python scripts/steam_crawler.py
        continue-on-error: true
      
      - name: Run CCU snapshot
        run: |
          python scripts/snapshot_ccu.py
        continue-on-error: true
      
      - name: Run fetch developers
        run: |
          python scripts/fetch_developers.py
        continue-on-error: true
      
      - name: Run fetch rich data
        run: |
          python scripts/fetch_rich_data.py
        continue-on-error: true
      
      - name: Run potential calculator
        run: |
          python scripts/calc_potential.py
        continue-on-error: true
      
      # === 重点游戏追踪 ===
      - name: Run DBD crawler
        run: |
          python scripts/dbd_crawler.py
        continue-on-error: true
      
      - name: Run R.E.P.O. crawler
        run: |
          python scripts/repo_crawler.py
        continue-on-error: true
      
      - name: Run Chaoziran crawler
        run: |
          python scripts/chaoziran_crawler.py
        continue-on-error: true
      
      - name: Run Chaoziran overseas crawler
        run: |
          python scripts/chaoziran_overseas_crawler.py
        continue-on-error: true
      
      - name: Run Steam news crawler
        run: |
          python scripts/steam_news_crawler.py
        continue-on-error: true
      
      # === Roblox 数据 ===
      - name: Run Roblox crawler
        run: |
          python scripts/roblox_crawler.py
        continue-on-error: true
      
      # === 数据验证 ===
      - name: Run DataValidator
        id: validate
        continue-on-error: true
        run: |
          python scripts/validate_data.py
      
      # === 健康检查 (数据是否及时更新) ===
      - name: Health check
        continue-on-error: true
        run: |
          python scripts/health_check.py
      
      # === 强制 commit (即使部分失败也 push 数据) ===
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            VALIDATION_STATUS="PASS"
            if [ "${{ steps.validate.outcome }}" != "success" ]; then
              VALIDATION_STATUS="VALIDATION FAILED - check report"
            fi
            git commit -m "chore: daily data snapshot $(date -u +%Y-%m-%d) [$VALIDATION_STATUS]"
            git push
          fi
